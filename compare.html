<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Coffee Ring Test — DO NOT INDEX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #dcddde; font-family: 'Inter', sans-serif; position: relative; isolation: isolate; }
  body::after { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(20, 30, 80, 0.03); mix-blend-mode: screen; pointer-events: none; z-index: 9999; }

  .container { display: flex; gap: 40px; padding: 60px 40px; max-width: 1400px; margin: 0 auto; justify-content: center; flex-wrap: wrap; }
  .option { text-align: center; }
  .option h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: #f5a623; margin-bottom: 20px; }
  .option p { font-size: 12px; color: #888; margin-top: 10px; font-family: monospace; }

  .coffee-ring {
    width: 150px;
    height: 150px;
    border: 3px solid rgba(245, 158, 11, 0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin: 0 auto;
  }
  .coffee-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  /* Option A: Transparent (current) */
  .opt-a .coffee-ring { background: transparent; }

  /* Option B: Dark grey 60% */
  .opt-b .coffee-ring { background: rgba(30, 30, 35, 0.6); }

  /* Option C: Dark grey 40% */
  .opt-c .coffee-ring { background: rgba(30, 30, 35, 0.4); }

  /* Option D: Coral 30% */
  .opt-d .coffee-ring { background: rgba(251, 113, 133, 0.3); }

  /* Option E: Coral 15% */
  .opt-e .coffee-ring { background: rgba(251, 113, 133, 0.15); }

  /* Option F: Amber 20% */
  .opt-f .coffee-ring { background: rgba(245, 166, 35, 0.15); }

  @media (max-width: 900px) {
    .container { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="option opt-a">
    <h3>A — Transparent</h3>
    <div class="coffee-ring"><img src="https://invoicesnapbot.com/images/betty-portrait-rembg.png" alt="Betty"></div>
    <p>background: transparent</p>
  </div>

  <div class="option opt-b">
    <h3>B — Dark Grey 60%</h3>
    <div class="coffee-ring"><img src="https://invoicesnapbot.com/images/betty-portrait-rembg.png" alt="Betty"></div>
    <p>rgba(30, 30, 35, 0.6)</p>
  </div>

  <div class="option opt-c">
    <h3>C — Dark Grey 40%</h3>
    <div class="coffee-ring"><img src="https://invoicesnapbot.com/images/betty-portrait-rembg.png" alt="Betty"></div>
    <p>rgba(30, 30, 35, 0.4)</p>
  </div>

  <div class="option opt-d">
    <h3>D — Coral 30%</h3>
    <div class="coffee-ring"><img src="https://invoicesnapbot.com/images/betty-portrait-rembg.png" alt="Betty"></div>
    <p>rgba(251, 113, 133, 0.3)</p>
  </div>

  <div class="option opt-e">
    <h3>E — Coral 15%</h3>
    <div class="coffee-ring"><img src="https://invoicesnapbot.com/images/betty-portrait-rembg.png" alt="Betty"></div>
    <p>rgba(251, 113, 133, 0.15)</p>
  </div>

  <div class="option opt-f">
    <h3>F — Amber 15%</h3>
    <div class="coffee-ring"><img src="https://invoicesnapbot.com/images/betty-portrait-rembg.png" alt="Betty"></div>
    <p>rgba(245, 166, 35, 0.15)</p>
  </div>
</div>

</body>
</html>
